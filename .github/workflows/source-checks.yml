name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -c constraints-tested.txt '.[dev]'
      - run: python -m pytest -q
      - run: python tools/scan_publication.py
      - run: python tools/check_secrets.py
